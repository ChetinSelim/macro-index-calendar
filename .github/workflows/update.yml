name: Update and deploy calendar
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      calendar_sha: ${{ steps.fingerprint.outputs.calendar_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Fetch schedules and validate complete publication
        run: python -m src.main --previous-url https://chetinselim.github.io/macro-index-calendar/state.json
      - name: Summarize source health
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('build/health.json')
          if path.exists():
              report = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('## Source health\n\n| Category | Status | Events | Last verified |\n|---|---|---:|---|\n')
                  for cat,h in report['categories'].items():
                      f.write(f"| {cat} | {h['status']} | {h['count']} | {h['last_success']} |\n")
          PY
      - name: Fingerprint validated calendar
        id: fingerprint
        run: echo "calendar_sha=$(sha256sum build/calendar.ics | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-diagnostics
          path: |
            build/health.json
            build/changes.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public calendar
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          CALENDAR_SHA: ${{ needs.build.outputs.calendar_sha }}
        run: |
          python -m pip install icalendar==6.3.2
          python - <<'PY'
          import hashlib, os, time
          from urllib.request import urlopen
          from icalendar import Calendar
          for attempt in range(12):
              try:
                  raw = urlopen(os.environ['SITE_URL'].rstrip('/') + '/calendar.ics', timeout=20).read()
                  assert hashlib.sha256(raw).hexdigest() == os.environ['CALENDAR_SHA'], 'Public calendar differs from validated artifact'
                  events = Calendar.from_ical(raw).walk('VEVENT')
                  assert events, 'Public calendar is empty'
                  categories = {str(e['X-SOURCE-CATEGORY']) for e in events}
                  assert categories == {'fomc','boe','nfp','cpi','pce','msci','sp500','russell','options','elections'}, categories
                  print(f'Public ICS matches validated artifact: {len(events)} events, all ten categories')
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(10)
          PY
